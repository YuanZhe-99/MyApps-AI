group = 'com.yuanzhe.myapps_ai'
version = '0.4.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}
apply plugin: 'com.android.library'
// AGP 9 supplies Kotlin; older hosts still require the Kotlin Gradle plugin.
if (!project.hasProperty('android.builtInKotlin') ||
        project.property('android.builtInKotlin').toString() == 'false') {
    apply plugin: 'kotlin-android'
}

repositories { google(); mavenCentral() }
android {
    namespace = 'com.yuanzhe.myapps_ai'
    compileSdk = 36
    defaultConfig {
        minSdk = 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
dependencies {
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    implementation 'com.google.mlkit:genai-proofreading:1.0.0-beta1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
