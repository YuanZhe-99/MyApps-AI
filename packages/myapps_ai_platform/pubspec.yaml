name: myapps_ai_platform
description: System on-device AI bridge for Android and Apple platforms.
version: 0.4.0
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.yuanzhe.myapps_ai
        pluginClass: MyAppsAiPlatformPlugin
      ios:
        pluginClass: MyAppsAiPlatformPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MyAppsAiPlatformPlugin
        sharedDarwinSource: true
