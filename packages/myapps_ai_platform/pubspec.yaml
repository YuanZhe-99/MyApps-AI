name: myapps_ai_platform
description: System on-device AI backend for Android and Apple platforms.
version: 0.5.3
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  myapps_ai_core:
    path: ../myapps_ai_core
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.yuanzhe.myapps_ai
        pluginClass: MyAppsAiPlatformPlugin
      ios:
        pluginClass: MyAppsAiPlatformPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MyAppsAiPlatformPlugin
        sharedDarwinSource: true
