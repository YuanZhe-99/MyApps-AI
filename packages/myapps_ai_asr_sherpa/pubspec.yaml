  sherpa-onnx adapter for myapps_ai_asr (Qwen3-ASR) and optional speaker diarization: pinned prebuilt libraries fetched by hash in a build hook.
version: 0.5.0
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  myapps_ai_asr:
    path: ../myapps_ai_asr
  myapps_ai_models:
    path: ../myapps_ai_models
  archive: 4.2.0
  code_assets: 2.1.0
  crypto: 3.0.7
  ffi: 2.2.0
  hooks: 2.2.0
  path: 1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: 22.0.0
