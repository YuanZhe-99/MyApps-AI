name: myapps_ai_llm_llama
description: >-
  llama.cpp LLM backend: upstream's pinned prebuilt libraries, fetched by
  hash in a build hook and bound directly from Dart.
version: 0.5.3
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  archive: ^4.0.0
  code_assets: '>=1.0.0 <3.0.0'
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: '>=1.0.0 <3.0.0'
  myapps_ai_core:
    path: ../myapps_ai_core
  myapps_ai_llm:
    path: ../myapps_ai_llm
  myapps_ai_models:
    path: ../myapps_ai_models
  path: ^1.9.0
dev_dependencies:
  ffigen: ^22.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
